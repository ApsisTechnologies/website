  features:
    title: Features
    items:
      - title: Artificial intelligence
        text: Unleash the future with AI integrations that make solving hard problems a thing of the past. From conversational voice-enabled chatbots to recommendation algorithms, we'll sprinkle human-like brilliance into your products.
      - title: Interface design
        text: Dazzle and captivate with interfaces that feel like home from the very first click. From 3D to 2D, we turn pixels into new pathways, crafting digital spaces where users don't just scroll and click, but flourish.
      - title: Pixel streaming
        text: Witness immersive graphics dance effortlessly from the cloud to your screen – no beefy GPUs required. Interact with mind-blowing visual experiences - even on low-end devices - with just an internet connection.
      - title: Full-stack engineering
        text: We transform your ideas into reality using our full-stack magic and engineering prowess. You can rest assured your vision is in expert hands every step of the way.
      - title: Hyper-scalable solutions
        text: We supercharge your company's digital journey through rock-solid infrastructure that can grow at the speed of your imagination. Our globally-scalable cloud solutions adapt to your needs, scaling with your users' demands.

