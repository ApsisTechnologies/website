  features:
    title: Services
    items:
      - title: Cloud Rendering
        text: Unleash the power of the web for games, architectural applications, product configurators and beyond. With Cloud Rendering technology, users can now experience next-gen graphics from any internet-enabled device, no GPUs or lengthy downloads required.

      - title: Multiplayer infrastructure
        text: Seamlessly deploy multiplayer games to our scalable cloud infrastructure, no Ops team required. Our ultra-low latency, multiplayer cloud solutions support most popular game engines, auto-scaling globally with player traffic.

      - title: Web3 solutions
        text: Integrate plug-and-play blockchain solutions to enable frictionless monetization of your game and entertainment projects. From collectibles, digital asset purchases and in-game microtransactions, blockchain technology paves the way to a permissionless, decentralized future.

      - title: Pipeline automation
        text: Accelerate your product release cycle by automating game builds and custom asset pipelines through our continuous integration solutions, freeing up your team's resources so they can focus on building experiences and iterating faster.

      - title: Web services
        text: From vibrant landing pages, documentation sites, blogs, user feedback, analytics solutions and more, we holistically build your online presence, empowering your marketing efforts so that you can continuously maximize fan value.

      - title: Game production
        text: Need help with game development and production? No problem! We can augment your team with top game dev talent, even taking full ownership of your project. From game concept to release, we got you covered every step of the way.

  portfolio:
