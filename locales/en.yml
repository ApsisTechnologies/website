  features:
    title: Features
    items:
      - title: Artificial intelligence
        text: We unleash the future with AI integrations that make solving hard problems a thing of the past. From conversational voice-activated chatbots to recommendation algorithms, we'll sprinkle human-like brilliance into your digital products.
      - title: Interface design
        text: Get ready to dazzle and captivate with interfaces that feel like home from the very first click. From 3D to 2D, we turn pixels into new pathways, crafting digital spaces where users don't just scroll and click, but flourish.
      - title: Pixel streaming
        text: Witness advanced, immersive graphics dance effortlessly from the cloud to your screen – no beefy GPUs required. Interact with mind-blowing visual experiences - even on low-end devices - with just an internet connection.
      - title: Full-stack engineering
        text: At RockinDev, we wield the full-stack magic needed to transform ideas into reality. With us, your vision is in expert hands every step of the way throughout the entire product release cycle and beyond.
      - title: Hyper-scalable infrastructure
        text: Our globally-scalable cloud infrastructure adapts to your needs, expanding and contracting with your users demands. From local to global, we empower your digital ambitions with a solid foundation that can grow at the speed of your imagination.

