    projects:
      minipcr:
        title: miniPCR Digital
        description: "We partnered with miniPCR Bio to develop their flagship, gamified e-learning platform, to train students on how to use their cutting-edge biotech products.\\nminiPCR delivers their technology to the International Space Station and we're proud to be a key part of their digital transformation!"

      ristband:
        title: Ristband
        description: "Ristband pushes the boundaries of live entertainment by bringing music shows to the metaverse.\\nWe developed Ristband's metaverse platform leveraging Unreal Engine's pixel streaming technology and AWS cloud infrastructure to deliver truly next-gen immersive experiences."

      forestify:
        title: Forestify
        description: "Forestify is an Ethereum-based decentralized app (a.k.a. \"dapp\") that allows users to invest in natural habitat restoration projects through nature-backed NFTs in a gamified experience with several tiers of rewards, producing a truly virtuous cycle."

      groovly:
        title: Groovly
        description: "\"TikTok for music\", Groovly is an audio platform that allows independent artists to upload short music tracks as well as unfinished projects to promote their work and grow their fan base."

