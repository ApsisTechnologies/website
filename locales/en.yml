  features:
    title: Services
    items:
      - title: Pixel streaming
        text: Enable high-end graphics in the cloud, no GPUs or lengthy downloads required. From AAA games, to architecture applications, product configurators and more, your users can now experience next-gen graphics from any internet-enabled device.

      - title: Multiplayer infrastructure
        text: Seamlessly deploy multiplayer game servers to our scalable cloud infrastructure. Our multiplayer cloud solutions support most popular game engines, autoscaling globally with player traffic; no Ops team required.

      - title: Web3 solutions
        text: Integrate plug-and-play blockchain solutions to enable frictionless monetization of your game and entertainment projects. From collectibles, digital asset purchases and in-game microtransactions, blockchain technology paves the way to a user-empowered, permissionless, decentralized future.

      - title: Pipeline automation
        text: Release projects faster by fully automating game builds through our Continuous Integration cloud solutions. We enable your development and production teams through game build solutions and custom asset pipelines, speeding up collaboration and iteration times.

      - title: Web services
        text: From vibrant landing pages to accessible documentation sites, user feedback tools and analytics solutions, we enhance your online presence and empower your Marketing teams so that you are free to focus on your core business.

      - title: Game production
        text: Need help with gameplay design, art or game development? No problem! We can augment your team with top, certified game development resources or take full ownership of your game development project. From game concept to release, we got you covered every step of the way.

