jobs:
  title: Join our team
  content:
    - If you love games, technology and creative challenges then we'd love to hear from you!
    - You can learn more about our values below. They should give you a pretty good idea of what it feels like being a part of our team. If this resonates with you then feel free to take a look at our open positions and consider applying.
    - We highly appreciate your interest in working with us and look forward to learning more about you.

  positions:
    open: See open positions
    closed: No open positions

  values:
    title: Our values
    description: Our values shape RockinDev's culture and work philosophy. We use them as guiding principles in our everyday work and our professional life, giving us a commom framework that helps us find meaning and become a cohesive, highly-effective team.

    items:
      - title: Be Curious
        body: Curiosity is the driving force that makes us constantly seek knowledge, ask questions and find answers, often in unlikely places. We value curiosity and expect our team members to freely express it, staying open to new ways of thinking and regularly venturing out of their comfort zones in order to constantly improve and innovate.

      - title: Have a growth mindset
        body: We believe that life is a never-ending process of acquiring knowledge, developing new skills and expanding our awareness in multiple areas. We actively disabuse ourselves of the notion that "we already know everything there is to know" and realize there's always room for improvement, while staying humble and open to new ideas.

      - title: Iterate and generalize
        body: Problem-solving is the main way in which we deliver value. Still, we realize we can go beyond the problem at hand and actively attempt to generalize solutions so that they can potentially transcend their original purpose, leading to discoveries, reusability, cost savings, efficiency and new business opportunities.

      - title: Active leadership
        body: Solving complex challenges requires team work, which in turn requires others to understand the value of our ideas. This means most of the time we can't solve problems in a vacuum. Instead, we actively hone our communication skills every chance we get in order to generate team alignment and eventually become trusted leaders.

      - title: Have integrity
        body: We take pride in our work and expect our team to act in a professional, honorable way. We prioritize doing what's right on top of doing what's easy, upholding our core values at all times.

      - title: Be Bold
        body: Change is often difficult and innovation requires constant experimentation. We recognize that for every successful experiment there might be many failed ones, so we encourage boldness, experimentation and calculated risk-taking. We realize that every failed attempt gets us one step closer to success.

      - title: Enjoy yourself
        body: Work is one of the main sources of human meaning. We strive not to just do excellent work but also to enjoy the process. be proud of what we accomplish together as a team and celebrate the victories.

