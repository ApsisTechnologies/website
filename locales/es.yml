        description: "Ristband desafía los límites del entretenimiento llevando shows de música en vivo al metaverso.\\nDesarrollamos la plataforma de metaverso de Ristband usando tecnología de Pixele Streaming de Unreal Engine junto con la infraestructura de cloud de AWS para ofrecer experiencias inmersivas de última generación."
