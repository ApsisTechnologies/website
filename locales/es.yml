jobs:
  title: Únete a nuestro equipo
  content:
    - ¡Si te apasionan los juegos, la tecnología y los retos creativos, nos encantaría saber de ti!
    - Puedes aprender más sobre nuestros valores a continuación. Deberían darte una buena idea de lo que se siente ser parte de nuestro equipo. Si esto resuena contigo, no dudes en echar un vistazo a nuestras posiciones abiertas y considera postularte.
    - Apreciamos mucho tu interés en trabajar con nosotros y esperamos aprender más sobre ti.

  positions:
    open: Ver posiciones abiertas
    closed: No hay posiciones abiertas

  values:
    title: Nuestros valores
    description: Nuestros valores dan forma a la cultura y la filosofía de trabajo de RockinDev. Los usamos como principios rectores en nuestro trabajo diario y nuestra vida profesional, dándonos un marco común que nos ayuda a encontrar significado y convertirnos en un equipo cohesivo y altamente efectivo.

    items:
      - title: Sé curioso
        body: La curiosidad es la fuerza impulsora que nos hace buscar constantemente el conocimiento, hacer preguntas y encontrar respuestas, a menudo en lugares inesperados. Valoramos la curiosidad y esperamos que nuestros miembros del equipo la expresen libremente, manteniéndose abiertos a nuevas formas de pensar y aventurándose regularmente fuera de sus zonas de confort para mejorar e innovar constantemente.

      - title: Tener una mentalidad de crecimiento
        body: Creemos que la vida es un proceso interminable de adquirir conocimiento, desarrollar nuevas habilidades y expandir nuestra conciencia en múltiples áreas. Descartamos activamente la idea de que "ya sabemos todo lo que hay que saber" y nos damos cuenta de que siempre hay espacio para mejorar, mientras nos mantenemos humildes y abiertos a nuevas ideas.

      - title: Iterar y generalizar
        body: La resolución de problemas es la principal forma en que entregamos valor. Aun así, nos damos cuenta de que podemos ir más allá del problema en cuestión e intentamos activamente generalizar las soluciones para que puedan trascender su propósito original, lo que lleva a descubrimientos, reutilización, ahorro de costos, eficiencia y nuevas oportunidades de negocio.

      - title: Liderazgo activo
        body: Resolver desafíos complejos requiere trabajo en equipo, lo que a su vez requiere que otros comprendan el valor de nuestras ideas. Esto significa que la mayoría de las veces no podemos resolver problemas en el vacío. En cambio, perfeccionamos activamente nuestras habilidades de comunicación en cada oportunidad para generar alineación en el equipo y eventualmente convertirnos en líderes de confianza.

      - title: Tener integridad
        body: Nos enorgullecemos de nuestro trabajo y esperamos que nuestro equipo actúe de manera profesional y honorable. Priorizamos hacer lo correcto por encima de lo fácil, manteniendo nuestros valores fundamentales en todo momento.

      - title: Sé valiente
        body: El cambio a menudo es difícil y la innovación requiere experimentación constante. Reconocemos que por cada experimento exitoso puede haber muchos fallidos, por lo que alentamos la audacia, la experimentación y la toma de riesgos calculados. Nos damos cuenta de que cada intento fallido nos acerca un paso más al éxito.

      - title: Disfruta
        body: El trabajo es una de las principales fuentes de significado humano. Nos esforzamos no solo en hacer un excelente trabajo, sino también en disfrutar el proceso, estar orgullosos de lo que logramos juntos como equipo y celebrar las victorias.

