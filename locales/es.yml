      forestify:
        title: Forestify
        description: "Forestify es una aplicación descentralizada basada en Ethereum app (o aplicación descentralizada) que permite a los usuarios invertir en proyectos de restauración de hábitats naturales a través de NFT respaldados por la naturaleza en una experiencia gamificada con varios niveles de recompensas, produciendo un ciclo virtuoso de inversión y restauración ecosistémico."
        accent: '#a2f838'

